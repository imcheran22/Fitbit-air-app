name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # One invocation with --continue so a single run reports every failing module and test,
      # not just the first one. The release build is unsigned unless signing material is
      # provided through local.properties or the environment (never committed).
      - name: Tests, lint, debug and release builds
        run: |
          set -o pipefail
          ./gradlew --continue \
            :core:domain:test :core:analytics:test testDebugUnitTest \
            :app:lintDebug :app:assembleDebug :app:assembleRelease 2>&1 | tee build-output.txt

      # Compiler, KSP, R8 and lint errors in a few lines at the end of the log, without the
      # Gradle stack traces, so failures can be read from the tail of the job log.
      - name: Summarise build errors
        if: always()
        run: |
          echo "==== BUILD ERROR SUMMARY ===="
          grep -E "^e: |^\[ksp\] .*error|ERROR:|> Task .* FAILED|^\* What went wrong|Lint found [0-9]+ error|Execution failed for task|Missing class|could not be resolved|Could not resolve" build-output.txt | grep -v "^\s*at " | sort -u | head -150 || true
          echo "==== END SUMMARY ===="

      - name: Summarise test failures
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          total = failed = 0
          for f in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  total += 1
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      failed += 1
                      msg = (bad.get("message") or "").splitlines()[0:3]
                      print(f"FAILED {case.get('classname')}.{case.get('name')}: {' | '.join(msg)[:400]}")
          print(f"TEST SUMMARY: {total} tests, {failed} failed")
          EOF

      # The release APK is unsigned unless real signing material is configured. For the emulator
      # smoke test only, sign a copy with a throwaway key made here; it is never published.
      - name: Sign a CI-only copy of the release APK
        if: always()
        run: |
          set -e
          IN=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          [ -n "$IN" ] || { echo "no release APK"; exit 0; }
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          keytool -genkeypair -keystore ci-throwaway.jks -storepass cithrowaway -keypass cithrowaway \
            -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Apex CI smoke" -noprompt
          mkdir -p smoke-apk
          "$BT/zipalign" -f -p 4 "$IN" smoke-apk/aligned.apk
          "$BT/apksigner" sign --ks ci-throwaway.jks --ks-pass pass:cithrowaway --key-pass pass:cithrowaway \
            --out smoke-apk/app-release-ci-signed.apk smoke-apk/aligned.apk
          rm -f smoke-apk/aligned.apk ci-throwaway.jks

      - name: Upload CI-signed release for the smoke test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-apk
          path: smoke-apk/app-release-ci-signed.apk
          if-no-files-found: warn
          retention-days: 3

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: core/database/schemas/**/*.json
          if-no-files-found: warn

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html

  # Spec section 13 item 4: the release APK launches on a clean emulator and survives Demo mode,
  # tab switches, rotation, 200 % font, a kill and relaunch, and dark mode.
  emulator-smoke:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: smoke-apk
          path: smoke-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke.sh smoke-apk/app-release-ci-signed.apk

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screens
          path: smoke/
          if-no-files-found: warn
